<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem Enviada | Land Criativa - Landing Pages Profissionais</title>
    
    <!-- Meta Tags Principais de SEO -->
    <meta name="description" content="Obrigado por entrar em contato com a Land Criativa. Sua mensagem foi enviada com sucesso e retornaremos em breve.">
    <meta name="robots" content="noindex, follow">
    
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="../imgs/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../imgs/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../imgs/favicon/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="../imgs/favicon/favicon.ico">
    
    <!-- Preconnect e Preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" as="style">
    <link rel="preload" href="styles.css" as="style">
    
    <!-- Estilos -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="custom.css">
    <link rel="stylesheet" href="obrigado.css">
</head>
<body>
    <!-- Preloader -->
    <div class="preloader">
        <div class="loader">
            <svg viewBox="0 0 80 80">
                <circle id="loader-circle" cx="40" cy="40" r="32"></circle>
            </svg>
            <div class="loader-text">
                <span>L</span>
                <span>A</span>
                <span>N</span>
                <span>D</span>
                <span>I</span>
                <span>N</span>
                <span>G</span>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="header-area">
        <nav class="navbar navbar-expand-lg fixed-top">
            <div class="container">
                <div class="theme-switch-wrapper ms-auto">
                    <button class="theme-switch" aria-label="Alternar tema">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Success Section -->
    <section class="success-section">
        <div class="bg-particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
        
        <div class="container">
            <div class="success-container" data-aos="fade-up">
                <div class="logo-area">
                    <img src="imgs/Logo land White.png" alt="Land Criativa Logo" class="logo-light">
                    <img src="imgs/Logo land Black.png" alt="Land Criativa Logo" class="logo-dark">
                </div>
                
                <div class="success-icon">
                    <i class="fas fa-check"></i>
                </div>
                
                <h1 class="success-title">Mensagem Enviada!</h1>
                
                <p class="success-message">
                    Obrigado por entrar em contato conosco. Sua mensagem foi recebida com sucesso!
                    <br>Retornaremos o mais breve possível.
                </p>
                
                <a href="index" class="btn btn-primary rounded-pill">
                    <i class="fas fa-home me-2"></i>Voltar para a Página Inicial
                </a>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="scripts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Configuração AOS
            AOS.init({
                duration: 1000,
                easing: 'ease-out-cubic',
                once: true
            });
        });
    </script>
</body>
</html>
